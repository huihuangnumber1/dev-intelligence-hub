name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js 22 regression
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Prepare canonical Windows workspace
        shell: pwsh
        run: |
          $workspaceRoot = 'C:\dev-intelligence-hub-ci-root'
          $projectRoot = Join-Path $workspaceRoot 'repo'
          $temporaryRoot = 'C:\dev-intelligence-hub-temp'
          $localAppDataRoot = 'C:\dev-intelligence-hub-localappdata'
          $currentUser = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          foreach ($root in @($workspaceRoot, $temporaryRoot, $localAppDataRoot)) {
            New-Item -ItemType Directory -Path $root -Force | Out-Null
            & icacls.exe $root /inheritance:r /grant:r "${currentUser}:(OI)(CI)F" "SYSTEM:(OI)(CI)F"
            if ($LASTEXITCODE -ne 0) { throw "Unable to secure $root" }
          }
          git clone --no-hardlinks "$env:GITHUB_WORKSPACE" $projectRoot
          git -C $projectRoot fetch "$env:GITHUB_WORKSPACE" $env:GITHUB_SHA
          git -C $projectRoot checkout --detach FETCH_HEAD
          $actualHead = git -C $projectRoot rev-parse HEAD
          if ($actualHead -ne $env:GITHUB_SHA) {
            throw "Canonical checkout is $actualHead instead of $env:GITHUB_SHA"
          }
          if (-not (Test-Path (Join-Path $projectRoot 'npm-shrinkwrap.json') -PathType Leaf)) {
            throw 'Canonical checkout is missing npm-shrinkwrap.json'
          }
          "CI_PROJECT_ROOT=$projectRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$temporaryRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$temporaryRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOCALAPPDATA=$localAppDataRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install structured CLI
        run: npm install --global @openai/codex

      - name: Install dependencies
        working-directory: ${{ env.CI_PROJECT_ROOT }}
        run: npm ci

      - name: Run portable regression suite
        working-directory: ${{ env.CI_PROJECT_ROOT }}
        shell: pwsh
        run: |
          $hostOnlyFiles = @(
            'codex-login-credential-broker.test.js'
            'manage-mydashboard.integration.test.js'
            'windows-codex-credential-file.test.js'
            'windows-fixed-test-runner.test.js'
            'windows-test-launcher.test.js'
          )
          $portableTests = @(
            Get-Item 'test/00-u9-priority.mjs'
            Get-ChildItem 'test/*.test.js'
            Get-ChildItem 'test/*.test.mjs'
          ) | Where-Object { $_.Name -notin $hostOnlyFiles } |
            Sort-Object FullName -Unique |
            ForEach-Object FullName
          # Mixed suites retain their portable assertions. Only real host
          # lifecycles stay with the configured-workstation npm test gate.
          $hostOnlyNames = @(
            '^default (?:non-versioned|versioned) Code Job owns one (?:real|lazy real) offline CLI lifecycle$'
            '^real offline CLI teardown survives an injected post-start failure$'
            '^real Windows asset, broker, journal and executor produce a restartable completed proof \('
            '^gh-login production-shaped pipeline runs a controlled executable and recovers post-create failure$'
            '^gh-login production factory constructs from sealed production ports$'
            '^Windows production root creation binds parent ACL trust to its creation handle across ABA$'
          )
          $hostSkipPattern = $hostOnlyNames -join '|'
          node --test --test-concurrency=2 --test-reporter=tap --test-skip-pattern $hostSkipPattern $portableTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The hosted command job cannot launch an independent Windows service.
          # Keep payload installation/composition checks here; npm test also
          # exercises the real manager lifecycle on the configured workstation.
          node --test --test-concurrency=1 --test-reporter=tap --test-skip-pattern 'the clean payload starts, reports status, and stops through its trusted manager' test/open-source-distribution.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @"
          ### Host-level validation

          Portable regression tests passed. Credential broker, Windows private ACL, PowerShell service manager, and real CLI lifecycle tests remain in `npm test` for a configured Windows workstation.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
